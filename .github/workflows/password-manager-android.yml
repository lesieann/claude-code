name: Password Manager (Android)

on:
  push:
    paths:
      - "password-manager-android/**"
      - ".github/workflows/password-manager-android.yml"
  pull_request:
    paths:
      - "password-manager-android/**"
      - ".github/workflows/password-manager-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: password-manager-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: passvault-debug-apk
          path: password-manager-android/app/build/outputs/apk/debug/app-debug.apk
